    DeepSeek-V4-Flash正式版上线
    DeepSeek-V4-Flash正式版已上线，可通过API访问，正式版V4-Flash相比此前的Preview版本，Agent（智能体）能力大幅增强，在多项基准测试中表现显著提升。此外，新版本原生支持Responses
