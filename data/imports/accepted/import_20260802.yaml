  event_title: 36氪独家｜曾爱玲入职B站担任AI视频生成业务负责人，向CEO陈睿汇报
  event_summary: 新闻动态 2026-07-31; 文｜王毓婵 兰杰 编辑｜乔芊
    36氪独家获悉，曾爱玲入职哔哩哔哩（下称“B站”），担任AI视频生成业务负责人，向CEO陈睿汇报。 36氪就此事向B站方面求证，对方暂无回应。 曾爱玲
    B站此前已公开表示，AI投入主要聚焦视频理解、视频推荐和辅助视频创作等方向。曾爱玲入职后，或将参与相关业务。 曾爱玲的个人主页显示，她曾在腾讯混元&AI
    Lab团队和国际数字经济研究院（IDEA）工作三年，领导以人为中心的感知与生成研究团队。其后，她加入米哈游创始人蔡浩宇旗下AI公司Anuttacon，负责开发以人为中心的交互式多模态视频生成系统。这些模型使AI智能体能够感知、交互并生成实时、长时程的视频。
    曾爱玲于香港中文大学计算机科学与工程系获得博士学位，并且曾是卡内基梅隆大学机器人研究所的访问学者。
    B站一直在寻找一个能稳定下来的AI业务带头人。去年9月，前快手副总裁、可灵AI事业部技术部原负责人张迪，曾跳槽B站，并出任技术条线负责人。但仅仅两个月左右，张迪就再次出走，回归阿里，担任淘天集团未来生活实验室负责人。五个月后，张迪带领团队打造出HappyHorse-1.0。
    2024年，B站上线了基础大模型Index，该模型能力主要被应用在视频内容创作、理解和分发等场景中。基于Index，B站搭建了角色扮演模型、语音生成模型、动漫视频生成模型等。
    另外，在创作工具方面，2026年3月，B站推出了AI视频创作平台updream ， 该工具具备“长期记忆”、“个性化技能库”与自由画布功能，主打专业级
    AI 内容管线。 updream界面截图
    在创作激励方面，B站密集推出与AI相关的创作赛事和活动。今年1月，B站启动了首届AI创作大赛，并在推出updream创作工具的当天，为获得一等奖的UP主颁发了高达100万元人民币的奖金。
    6月，B站启动“build in bilibili ·
    AI创造公开赛”，参赛者只需使用AI工具，创造一个可运行、可交互的产品，并在B站持续发布创作过程视频，即可完成报名参赛。赛事不设固定赛道或主题，实物和软件应用均可参与。比赛将评选权交给用户——所有B站用户均可通过投币、弹幕等方式参与创作并选出认可的产品。比赛设置超130万元的现金奖金池，其中冠军独享百万元奖金。
    该大赛启动一个月后，投稿创作者数量逼近5000人，站内“vibe coding”相关关键词日均搜索量增长6倍。
    7月，B站正式推出网页内容发布平台“Toy”。该平台支持将本地创意网页一键发布为站内可直接访问、可玩的互动作品。UP主无论是自主开发，还是借助AI
    Agent、Vibe coding等AI工具快速生成和迭代，都能将创意沉淀于站内，转化为用户可玩、可测、可用、可看的内容。 Toy 界面截图
    在6-7月的内测过程中，UP主已在Toy上传超300件作品，涵盖游戏、互动叙事、工具、测试、报告、画册等多个品类。同时站内公开数据显示，平台用户体验量已累计超850万次。
    目前正在站内进行中的活动还包括与阿斯塔纳国际AI电影节合办的“AI全民制作人”、以及鼓励用updream生成AI动画作品的“UP动画剧场签约激励计划”等。
    据B站方面披露，2026年， AI 泛智能体（AI
    Agent）、AI创业等关键词在B站的搜索量同比增长超500%。2026年第二季度数据显示，每月有超过1.9亿用户在B站观看AI相关内容。
    以及，在广告提效方面，B站将AI引入了广告分发与推荐系统，为广告主提供AIGC广告素材生成、智能投放与自动广告，以及植入式智能广告探索等服务。
    B站方面公开数据显示，AIGC广告素材消耗占比超过50%，且点击率（CTR）比传统素材实现双位数增长。自动广告消耗渗透率超85%，整体广告分发效率提升明显。
    在今年一季度财报电话会议上，陈睿提到：“AI 没有改变 B 站底层逻辑，但放大了这两大优势。” “AI 是十倍放大的历史性机遇，我们将牢牢把握。”;
    来源 https://36kr.com/feed.
