pack_id: china_innovative_drugs_20260809
title: 中国创新药产业研究包
description: >-
  以监管、医保和跨国药企原始披露建立可复现的原文取证入口。该研究包不接受二级报道的结论，
  也不把交易 headline value 等同于已实现收入、临床成功或全球商业化。
research_questions:
  - 中国创新药对外授权是否已有持续的跨国药企原始披露与可核验的资本确认？
  - 原始创新与新机制获批能否由监管原文独立支持，而非仅由新闻标题支持？
  - 国内支付与商业化是否构成独立分支，且不与临床研发或对外授权混合判断？
proposed_taxonomy:
  parent_name: 中国创新药产业
  parent_topic_id: null
  proposed_branches:
    - branch_name: 全球 BD 与对外授权
      branch_id: innovative_drug_license_out
      rationale: 已有正式主题，保留其独立的资本与现实证据链。
    - branch_name: 原始创新与新机制获批
      branch_id: null
      rationale: 需先经 Topic Resolver 命名和证据验证，不能继承对外授权阶段。
    - branch_name: 国内支付与商业化
      branch_id: null
      rationale: 需以支付准入和真实使用证据单独判断，不能由临床或 BD 代替。
