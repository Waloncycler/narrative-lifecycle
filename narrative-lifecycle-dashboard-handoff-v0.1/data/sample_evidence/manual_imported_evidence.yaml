  event_date: 2026-07-31
  event_title: "Sign compression for Muon: SignMuon, MuonSign, and the Limits of
    Error Feedback"
  event_summary: "arXiv 预印本发布于 2026-07-31; SignMuon compresses the Muon update to
    one bit per parameter by taking its elementwise sign, providing the most
    direct way to run a matrix-aware optimizer under an extremely low
    communication budget. It outperforms SignSGD in practice, yet it can ascend
    even on a linear function. Signing the gradient before the Linear
    Minimization Oracle (LMO), rather than after, does not repair this: we
    construct a small explicit instance on which sign-before (MuonUSign) and
    sign-on-both-sides (MuonSign) ascend as well, so no placement of the sign
    around the oracle descends in general. Error feedback, the standard remedy
    for a biased compressor, does not rescue SignMuon: when applied to Muon's
    output, error feedback can fail for every smoothness constant, step size,
    and momentum. Applied to the gradient, error feedback does work, and
    EF21-MuonUSign and EF21-MuonSign attain the standard
    $\\mathcal{O}(T^{-1/2})$ rate for the squared gradient norm on smooth
    nonconvex problems, the latter at one bit in each direction. Experiments
    then reverse the ordering: across centralized CIFAR-10, federated CIFAR-10,
    and the nanoGPT speedrun, the strongest compressed method is consistently
    sign-after-the-LMO, precisely the placement we prove divergent, with the
    provably convergent variants trailing it. Compressing after the LMO, a
    heuristic, matters more at these scales than the guarantee does.; 作者
    <name>Maria Smirnova</name>."
