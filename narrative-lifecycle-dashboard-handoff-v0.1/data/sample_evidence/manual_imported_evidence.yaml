- evidence_id: wm_direct36_kr_feed-https_36kr_com_p_3923374038265217_f_rss-c2f5e8976602
  topic_id: provisional_ai_foundation_models
  branch_id: null
  event_date: 2026-08-03
  event_title: 硬氪首发 | 硅光资深团队获数千万天使轮融资，瞄准CPO/OIO下一代光互连解决方案
  event_summary: 新闻动态 2026-08-03;
    硬氪获悉，光芯片企业量引科技近期完成天使轮数千万元融资，由珠海科技产业集团领投，珠海正方集团、险峰跟投。此次融资将用来扩充团队、迭代流片和补充设备。
    量引科技成立于2024年，聚焦光子集成电路领域，致力于硅光子传输芯片(PIC)，Optical IO(OIO)及共封装光学(CPO)的研发及应用。
    图源企业
    公司创始团队融合了国内外研发和制造经验，创始人李耀基拥有30余年的集成电路行业经验，曾任重庆联合微电子CUMEC工程副总裁，Cadence中国区首席技术官、国家专用集成电路系统工程技术研究中心香港分中心副主任，在美国和中国的半导体行业都有着丰富资源与技术积淀。
    联合创始人兼CTO赵京雄曾担任CUMEC技术总监，美国思科、英特尔技术负责人，拥有多年AI
    GPU/NPU/Switch/硅光芯片的架构设计经验。首席科学家Craig
    Peterson是英特尔微电子中心总经理，在英特尔拥有多年的工作经历，参与设计了三款处理器、八代芯片组。
    随着生成式AI与大模型训练需求的爆发，算力集群的规模正在经历前所未有的指数级增长，传输速率迈向1.6T乃至3.2T。这意味着，传统的信号调制方式面临着高功耗、热流密度集中以及较高的物理链路闪断风险，传统基于可插拔光模块的电传输网络正在触及物理天花板。为了打破其中的供需差，将光引擎与计算芯片或交换芯片进行深度集成，即从可插拔模式走向CPO乃至OIO已成为业界公认的通往超高速率光互连的唯一路径。
    据LightCounting/Yole预测，CPO将率先在未来几年迎来爆发，而最终渗透进每一颗高端GPU/CPU的OIO更是蕴含着千亿美元级别的潜在市场。量引科技则从作为CPO与OIO的核心器件微环调制器（也称“MRM”）为切口进入这一高门槛赛道。
    相较于传统的EML或MZM调制方案，MRM具有微米级的极小物理尺寸与低至1V的驱动电压，能够天生适配高密度的先进封装并显著降低系统能耗。在此基础上，量引科技构建了基于自研单通道200G
    MRM的1.6T及更高速率的硅基光芯片。 同时，公司正着手布局匹配下一代互连架构的CPO方案以及面向芯片级互连的Optical I/O
    Chiplets产品。其方案旨在大幅缩短电传输距离、去除高功耗的DSP芯片，将系统光互连能耗降至极低水平，为超大规模数据中心打造高速且低能耗的光传输“公路”。
    针对MRM技术普遍存在的温度敏感这一产业化难题，量引自研了实时温控反馈及电均衡算法IP，确保了微环调制器在严苛数据中心环境下的稳定工作。更关键的是，公司掌握了底层的硅光PDK（工艺设计包）自研能力，并采用成熟且国内自主可控的CMOS工艺节点进行生产，从源头上规避了高端制程的供应链风险。
    以下是对量引科技CTO赵京雄的访谈节选： 硬氪：现在OIO赛道非常火热，量引相比同行核心优势在哪里？ 赵京雄：
    首先我们拥有实质的流片与测试经验，而非仅停留在仿真阶段。OIO的核心是紧密的光电交换，英伟达、AMD以及Ayar
    Labs等海外大厂在计算和高带宽密度应用上都走MRM（微环调制器）路线。我们过去有多次设计迭代的经验，公司今年最新一轮1.6T
    MRM光芯片流片已完成，目前正在测试中，在国内具有先发优势。
    其次，我们的微环FSR（自由光谱范围）设计得比较宽。OIO应用需要极多的通道数量，一般采用DWDM（密波分复用），即在单一波导下放多个波长。如果微环的FSR不够宽，调制第一个波长时就会产生串扰，影响相邻通道，导致无法放下太多微环同时调制。
    最后也是最重要的一点，我们具备底层的自研关键器件能力，而非依赖代工厂的PDK，事实上目前也没有几个工厂能提供微环PDK。如果后续针对某些特定应用需要调整器件性能，我们不会像依赖标准PDK的团队那样难以调整。
    硬氪：自研内部设计库，在跟代工厂交涉时良率能保证吗？ 赵京雄：
    这确实点到了核心问题。代工厂提供的标准PDK，设计通常会优先考虑良率，因此给出的性能参数相对稳妥和保守，难以满足定制化需求。而我们面向特定应用场景和差异化客户需求时，会更看重性能是否匹配，并针对性地做一些设计上的调整。
    当然，针对良率这块，我们会通过多次迭代流片来进行数据收集，并以此逐步对设计进行调整和优化，这是从工程验证走向规模量产必然要经历的磨合过程。
    硬氪：接下来的芯片流片有什么样的计划？ 赵京雄： 过去我们的开发主要集中在单通道200G
    MRM器件本身，而这次出来的光电集成芯片是整片芯片，我们成功把合路器、波导、分光器、PD等所有功能器件都集成在一起，让我们对整个芯片的设计流程和功能器件组合有了系统性的掌握。接下来，我们会继续进行多轮流片，确保最终量产的高良率与可靠性。
    硬氪：建立国产光互联生态，目前面临的最大问题是什么？量引打算怎么做？ 赵京雄：
    在国外，有英伟达这样的计算与交换巨头推动的封闭生态。但国内，目前产业链还没有完全就位，光互联主要涉及的计算芯片、光芯片和先进封装这三大板块形成有效协同还需要时间。
    面对这些现状，我们首先会立足本业，把光芯片做好，并协同上下游保障Driver IC、TIA和激光器等关键器件供应链稳定。在CPO/OIO方向上,
    我们已经跟国内头部GPU厂商达成合作并进入PoC阶段，重点攻克接口、GPU和光引擎之间的光电信号转换及协议层适配。同时，我们正同步配合封装厂推进TSV等3D堆叠先进封装的联合研发。
    我们在生态圈里的定位是核心光互联赋能者，率先让国产光芯片在新一代算力系统里跑通，为产业链上下游打开协作与发展的想象空间。; 来源
    https://36kr.com/feed.
