    Social发布涉及关税、战争、央行领导层及其他重大政策的消息，这些内容往往会迅速引发股票、债券、汇率和大宗商品价格波动。批评者认为，即使帖子理论上同时向公众发布，付费客户通过更快的数据接口和自动交易系统，仍可能比普通投资者更早采取行动。
