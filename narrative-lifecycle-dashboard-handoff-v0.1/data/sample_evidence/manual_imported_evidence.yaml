- evidence_id: wm_direct36_kr_feed-https_36kr_com_p_3920595518533250_f_rss-c2f5e8976602
  topic_id: humanoid_robotics
  branch_id: null
  event_date: 2026-08-01
  event_title: 三天、十八场对谈、一个问题：ChinaJoy还只是游戏展吗？
  event_summary: 新闻动态 2026-08-01; 如果有个人在零几年走进刚刚开办的 ChinaJoy 展馆，看到玩家排队试玩、ShowGirl
    站在《魔兽世界》展台前、Coser 在《最终幻想》的海报前合影，他大概不会怀疑，这就是一个关于游戏的展会。
    因为他是对的，在看似遥远的2004年，中国游戏市场正处于蓬勃发展的阶段。首届 ChinaJoy，是当时国内屈指可数的大型游戏展会。
    但二十年多后，如果有人走进2026 年的 ChinaJoy，还觉得它只是关于游戏，他大概会错过这个时代最值得看的一件事。 2026年，ChinaJoy
    即将在7月底的上海举办第二十三届展会。 如今的 ChinaJoy 还只是游戏展吗？
    它依然是全国最爱玩、最关注游戏的年轻人一年一度的线下聚会，这件事从未改变。但同时，ChinaJoy 正在悄然成为「科技 +
    数字娱乐」行业一年一度的线下交汇点。 过去三年，科技对数字娱乐的改造速度超过了所有人的预期：AI
    从实验室概念变成了行业标配的生产工具，具身智能、新一代消费电子不断打开新的想象空间，每一个赛道、每一天都有新公司、新产品、新模式冒出来。
    ChinaJoy 是国内极少数能把这种变化一次性摊开在你面前的现场。 如今，来逛展的不只是玩家，还有开发者、AI 工程师、硬件创业者、投资人。
    真正值得被报道的东西，已经藏在线下。如果只看相关稿件，这个行业的很多真实温度仍然难以感知。 因此，这一次36氪和ChinaJoy「Vision
    Future 前沿科技展区」深度合作，把直播间直接搬到展区现场。三天，十八场对谈，我们想把这些一线的思考直接带给每个观众。
    所有对谈都来自一线从业者——创业者、技术带头人、行业操盘手、学术专家，坐到镜头前聊真实进展、踩过的坑、接下来的机会。我们想呈现最鲜活的行业趋势，不是发布会的复述，是真问题的现场。
